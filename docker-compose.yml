services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - upload_data:/app/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - model_data:/app/models
      - upload_data:/app/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  model_data:
  upload_data:
